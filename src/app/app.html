<header class="site-header">
  <nav class="container">
    <a class="brand" routerLink="/">Wanderlog</a>
    <div class="links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
      <a routerLink="/posts" routerLinkActive="active">Stories</a>
      <form class="search" role="search" (submit)="search($event, query)">
        <input
          #query
          type="search"
          placeholder="Search"
          aria-label="Search stories"
          enterkeyhint="search"
        />
      </form>
    </div>
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container">© {{ year }} Wanderlog · Made with Angular</div>
</footer>
